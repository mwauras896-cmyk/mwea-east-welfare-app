<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwea East JSS Teachers Welfare</title>
    <style>
        :root {
            --deep-teal: #004d40;
            --gold: #d4af37;
            --light-bg: #f4f6f7;
            --text-dark: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--deep-teal);
            color: var(--gold);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 4px solid var(--gold);
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        header p {
            margin: 0.5rem 0 0 0;
            font-size: 0.9rem;
            color: #ffffff;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: var(--deep-teal);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 5px;
            font-size: 1.2rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--deep-teal);
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #00332c;
        }
        button:disabled {
            background-color: #cccccc;
            border-color: #aaaaaa;
            color: #666666;
            cursor: not-allowed;
        }
        .admin-notice {
            background: #fff8e1;
            border-left: 4px solid var(--gold);
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mwea East JSS Teachers Welfare</h1>
        <p>Transparency • Accountability • Support</p>
    </header>

    <div class="container">
        <div class="admin-notice">
            <strong>Chairman Security Notice:</strong> All administrative verifications, disbursements, and password resets are exclusively managed by the Chairman.
        </div>

        <h2>M-Pesa Contribution Portal</h2>
        <div class="form-group">
            <label for="phone">Safaricom Phone Number</label>
            <input type="tel" id="phone" placeholder="07XXXXXXXX or 2547XXXXXXXX" value="254728065957">
        </div>
        <div class="form-group">
            <label for="amount">Contribution Amount (KES)</label>
            <input type="number" id="amount" placeholder="1000">
        </div>
        <button id="payBtn" onclick="triggerStkPush()">Pay via M-Pesa STK Push</button>
    </div>

    <script>
        async function triggerStkPush() {
            let phone = document.getElementById('phone').value.trim();
            const amount = document.getElementById('amount').value.trim();
            const payBtn = document.getElementById('payBtn');

            if (!phone || !amount) {
                alert('Please enter both phone number and amount.');
                return;
            }

            // Standardize phone number format to 254XXXXXXXXX
            if (phone.startsWith('0')) {
                phone = '254' + phone.slice(1);
            } else if (phone.startsWith('+254')) {
                phone = phone.slice(1);
            } else if (!phone.startsWith('254')) {
                phone = '254' + phone;
            }

            payBtn.disabled = true;
            payBtn.innerText = 'Processing...';

            try {
                const response = await fetch('https://mwea-east-welfare-api.onrender.com/api/stkpush', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ phone, amount })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`STK Push initiated successfully to ${phone}! Check your phone for the M-Pesa prompt.`);
                } else {
                    alert(`STK Push Failed: ${data.message || 'Something went wrong.'}`);
                }
            } catch (error) {
                console.error('Error triggering STK push:', error);
                alert('Unable to connect to the payment server. Please try again.');
            } finally {
                payBtn.disabled = false;
                payBtn.innerText = 'Pay via M-Pesa STK Push';
            }
        }
    </script>
</body>
</html>
