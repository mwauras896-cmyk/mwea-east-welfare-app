<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mwea East JSS Teachers Welfare</title>
  <style>
    :root {
      --deep-teal: #004d40;
      --gold: #d4af37;
      --light-bg: #f4f6f7;
      --text-dark: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
    }
    header {
      background-color: var(--deep-teal);
      color: var(--gold);
      padding: 1.5rem 1rem;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }
    .logo-container {
      margin-bottom: 10px;
    }
    .app-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      object-fit: cover;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    header p {
      margin: 0.5rem 0 0 0;
      font-size: 0.9rem;
      color: #ffffff;
    }
    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      color: var(--deep-teal);
      border-bottom: 2px solid var(--gold);
      padding-bottom: 5px;
      font-size: 1.2rem;
      margin-top: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: var(--deep-teal);
      color: var(--gold);
      border: 2px solid var(--gold);
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #00332c;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: var(--deep-teal);
      color: white;
    }
    .badge {
      background-color: #d4edda;
      color: #155724;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .admin-notice {
      background: #fff8e1;
      border-left: 4px solid var(--gold);
      padding: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }
  </style>
</head>

    <p>Transparency • Accountability • Support</p>
  </header>
